# Monthly savings to allocate, in EUR.
monthly_savings = 1100

# Envelope shares. Must sum to 1.
[envelopes]
PEA    = { share = 0.40 }
CTO    = { share = 0.20 }
CRYPTO = { share = 0.15 }
AFER   = { share = 0.10 }
EPSOR  = { share = 0.10 }
OTHER  = { share = 0.05 }

# Assets. Within each envelope, weights must sum to 1.
# price_source: "yfinance" (default, needs a ticker) or "manual" (no ticker, no
# PRUM, no chart, no simulator - the value is entered by hand).
[[assets]]
envelope = "PEA"
ticker = "WPEA.PA"
label = "Amundi PEA MSCI World"
weight = 1.00
currency = "EUR"

[[assets]]
envelope = "CTO"
ticker = "VWCE.DE"
label = "Vanguard FTSE All-World"
weight = 0.75
currency = "EUR"

[[assets]]
envelope = "CTO"
ticker = "WSML.AS"
label = "iShares MSCI World Small Cap"
weight = 0.25
currency = "EUR"

[[assets]]
envelope = "CRYPTO"
ticker = "ETH-USD"
label = "Ethereum USD"
weight = 0.50
currency = "USD"

[[assets]]
envelope = "CRYPTO"
ticker = "BTC-USD"
label = "Bitcoin USD"
weight = 0.50
currency = "USD"

# Legacy position kept from the Postgres database. Weight 0: tracked but never
# allocated by the monthly split.
[[assets]]
envelope = "CRYPTO"
ticker = "SOL-USD"
label = "Solana USD"
weight = 0.00
currency = "USD"

[[assets]]
envelope = "AFER"
ticker = "AFER"
label = "AFER life insurance"
weight = 1.00
currency = "EUR"
price_source = "manual"

[[assets]]
envelope = "EPSOR"
ticker = "EPSOR"
label = "Epsor retirement savings"
weight = 1.00
currency = "EUR"
price_source = "manual"

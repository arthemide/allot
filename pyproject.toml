[project]
name = "allot"
version = "0.9.0"
description = "Allot - per-asset PRUM tracking and monthly allocation note"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
    "curl-cffi>=0.16.3",
]

[dependency-groups]
# The local-machine path: discover and the Playwright-driven sync. Not in the
# image.
connectors = [
    "beautifulsoup4>=4.15.0",
    "playwright>=1.63.0",
]
# The in-app path: woob logs in and reads the positions. Installed in the
# image only when built with INSTALL_WOOB=1.
woob = [
    "woob>=3.7",
]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.16.0",
    "pytest-cov>=6.0.0",
    # TestClient speaks to the app through httpx; the app itself uses
    # curl_cffi, so this belongs to the tests only.
    "httpx>=0.28.0",
    "ruff>=0.16.10",
    "beautifulsoup4>=4.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=src --cov=app --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.coverage.run]
# The browser half of the connectors needs a human at the keyboard; the pure
# half (masking, summary) is what the tests cover.
omit = [
    "src/connectors/browser.py",
    "src/connectors/__main__.py",
    "src/connectors/woob_bourso.py",
]

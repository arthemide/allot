[project]
name = "allot"
version = "0.4.0"
description = "Allot - per-asset PRUM tracking and monthly allocation note"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "curl-cffi>=0.16.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=6.0.0",
    # TestClient speaks to the app through httpx; the app itself uses
    # curl_cffi, so this belongs to the tests only.
    "httpx>=0.28.0",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=src --cov=app --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[project]
name = "allot"
version = "0.10.0"
description = "Allot - per-asset PRUM tracking and monthly allocation note"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.156.4",
    "uvicorn>=0.54.0",
    "curl-cffi>=0.16.3",
]

[dependency-groups]
# The in-app path: woob logs in and reads the positions. Installed in the
# image only when built with INSTALL_WOOB=1. Pinned exactly: 3.7 is woob's last
# core release, and scripts/woob_update.py checks every module build against it.
woob = [
    "woob==3.7",
]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.17.0",
    "pytest-cov>=6.0.0",
    # TestClient speaks to the app through httpx; the app itself uses
    # curl_cffi, so this belongs to the tests only.
    "httpx>=0.28.0",
    "ruff>=0.17.1",
    "beautifulsoup4>=4.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=src --cov=app --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

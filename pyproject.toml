[project]
name = "allot"
version = "0.1.0"
description = "Allot - per-asset PRUM tracking and monthly allocation note"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "yfinance>=0.2.40",
]

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-mock>=3.14.0", "ruff>=0.14.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

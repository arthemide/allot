# sandbox-shared-volumes.yaml
# Use this file with docker-compose to enable live code reloading during development
# Usage: docker-compose -f docker-compose.yaml -f shared-volumes.yaml up

services:
  api:
    volumes:
      - ./backend/api/src:/app/src
    # Override command to enable hot-reload
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
  
  front:
    volumes:
      # Keep these for live code reloading
      - ./front/src:/app/src
      - ./front/svelte.config.js:/app/svelte.config.js
      - ./front/tailwind.config.js:/app/tailwind.config.js
      - ./front/vite.config.ts:/app/vite.config.ts
      - ./front/postcss.config.js:/app/postcss.config.js
      - stock_alerting_front_node_modules:/app/node_modules
      
    # Install dependencies before starting the dev server
    command: sh -c "npm install && npm run dev -- --host --port 3000"
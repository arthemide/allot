[project]
name = "stock-alerting-workspace"
version = "0.1.0"
description = "Stock alerting backend monorepo"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["api", "bot", "shared"]

[dependency-groups]
dev = [
    "pytest>=8.2.1",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "ruff>=0.14.8",
]

[tool.coverage.run]
omit = [
    "bot/dca/main.py",
    "bot/dca/test_debug.py",
]

[tool.coverage.report]
omit = [
    "bot/dca/main.py",
    "bot/dca/test_debug.py",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["shared", "src", "dca"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

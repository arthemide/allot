# Weekly, grouped: this project moves slowly, and one PR per patch bump would
# only train us to ignore them.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /front
    schedule:
      interval: weekly
    groups:
      front:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The python:3.12-slim, node:22-alpine and alpine base images.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

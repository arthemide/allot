name: python-app

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: checkout repo
      uses: actions/checkout@main
    - name: Install and configure Poetry
      uses: snok/install-poetry@v1
    - name: Set up cache
      id: cached-poetry-dependencies
      uses: actions/cache@v2
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}
    - name: Install dependencies
      run: make install
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
    - name: save cache status
      id: cache-status
      run: echo "cache-hit=${{ steps.cached-poetry-dependencies.outputs.cache-hit }}" >> $GITHUB_ENV

  check:
    runs-on: ubuntu-latest
    needs: setup
    steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: checkout repo
      uses: actions/checkout@main
    - name: Install and configure Poetry
      uses: snok/install-poetry@v1
    - name: Set up cache
      id: cached-poetry-dependencies
      uses: actions/cache@v2
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}
    - name: Install dependencies
      run: make install
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
    - name: check code
      run: make check

  test:
    runs-on: ubuntu-latest
    needs: setup
    steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: checkout repo
      uses: actions/checkout@main
    - name: Install and configure Poetry
      uses: snok/install-poetry@v1
    - name: Set up cache
      id: cached-poetry-dependencies
      uses: actions/cache@v2
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}
    - name: Install dependencies
      run: make install
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
    - name: run tests
      run: make tests

name: stock-alerting-checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      run: pip install uv

    - name: Set up cache
      uses: actions/cache@v4
      with:
        path: api/.venv
        key: venv-${{ runner.os }}-${{ hashFiles('api/uv.lock') }}

    - name: Install dependencies
      working-directory: api
      run: uv sync
      if: steps.cache.outputs.cache-hit != 'true'

  check:
    runs-on: ubuntu-latest
    needs: setup
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      run: pip install uv

    - name: Set up cache
      uses: actions/cache@v4
      with:
        path: api/.venv
        key: venv-${{ runner.os }}-${{ hashFiles('api/uv.lock') }}

    - name: Install dependencies
      working-directory: api
      run: uv sync
      if: steps.cache.outputs.cache-hit != 'true'

    - name: Check code
      working-directory: api
      run: make check

  tests:
    runs-on: ubuntu-latest
    needs: setup
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      run: pip install uv

    - name: Set up cache
      uses: actions/cache@v4
      with:
        path: api/.venv
        key: venv-${{ runner.os }}-${{ hashFiles('api/uv.lock') }}

    - name: Install dependencies
      working-directory: api
      run: uv sync
      if: steps.cache.outputs.cache-hit != 'true'

    - name: Run tests
      working-directory: api
      run: make tests

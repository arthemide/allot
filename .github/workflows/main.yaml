name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job below only reads the repository. The two that need more say so
# themselves.
permissions:
  contents: read

env:
  # Lowercase literal, not ${{ github.repository }}: the owner is spelled
  # "Arthemide" and Docker refuses uppercase in an image name.
  IMAGE: ghcr.io/arthemide/allot

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest -q

  front:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check
        run: npm run check
      - name: Build
        run: npm run build

  versions:
    name: Versions agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: pyproject.toml and front/package.json must match
        run: |
          BACK=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          FRONT=$(python3 -c "import json;print(json.load(open('front/package.json'))['version'])")
          echo "backend=$BACK front=$FRONT"
          if [ "$BACK" != "$FRONT" ]; then
            echo "::error::versions drifted: pyproject.toml=$BACK front/package.json=$FRONT"
            exit 1
          fi

  image:
    name: Image builds and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      # The deployment target is a 32-bit Raspberry Pi, and several things in
      # this image are chosen per architecture -- the Litestream binary above
      # all. Building that variant here means a wrong choice fails on the pull
      # request rather than at release time, when the tag is already pushed.
      - name: Build for the deployment target
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm/v7
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Loadable, so the smoke test below can actually run it.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: allot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start it and wait for /health
        run: |
          docker run -d --name allot-ci -p 8000:8000 allot:ci
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo "\nhealthy after ${i} tries"
              exit 0
            fi
            sleep 3
          done
          echo "::error::the container never became healthy"
          docker logs allot-ci
          exit 1
      - name: Stop
        if: always()
        run: docker rm -f allot-ci || true

  check-version:
    name: Check version
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      new_release: ${{ steps.check.outputs.new_release }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Extract version
        id: version
        run: |
          VERSION=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Check if tag already exists
        id: check
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "new_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "new_release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [backend, front, versions, image, check-version]
    if: needs.check-version.outputs.new_release == 'true'
    permissions:
      contents: write # commit the changelog, push the tag, create the release
      packages: write # push the image to GHCR
      id-token: write # provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate CHANGELOG
        uses: orhun/git-cliff-action@v4
        with:
          args: --tag ${{ needs.check-version.outputs.tag }} --output CHANGELOG.md

      - name: Commit changelog and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): update changelog for ${{ needs.check-version.outputs.tag }}"
            # main may have moved while the gates above ran.
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          git tag "${{ needs.check-version.outputs.tag }}"
          git push origin "${{ needs.check-version.outputs.tag }}"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.check-version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.check-version.outputs.tag }}
            type=raw,value=latest

      # arm/v7 is the deployment target (a 32-bit Raspberry Pi); the other two
      # are for development machines. Nothing in the image is compiled from
      # source, so the emulated builds stay cheap.
      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ needs.check-version.outputs.tag }}
          generate_release_notes: true

name: woob module update

# woob publishes module builds continuously but keeps only the latest one, so
# the boursorama module is vendored. Once a week, refresh it through the same
# signed, pinned path as `make woob-update` and propose the diff as a PR.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install gpgv
        run: command -v gpgv || (sudo apt-get update && sudo apt-get install -y gpgv)
      - name: Refresh the module
        id: update
        run: make woob-update
      # A fine-grained token limited to this repository (contents and pull
      # requests: write). With GITHUB_TOKEN the PR would not trigger CI.
      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.WOOB_UPDATE_TOKEN }}
          branch: chore/woob-boursorama
          add-paths: vendor/woob-modules
          delete-branch: true
          commit-message: "chore(deps): update woob boursorama module to ${{ steps.update.outputs.version }}"
          title: "chore(deps): update woob boursorama module to ${{ steps.update.outputs.version }}"
          body: |
            woob published a new build of the `boursorama` module: `${{ steps.update.outputs.version }}`.

            Its index and archive were checked with gpgv against `vendor/woob-modules/trusted.gpg`, and the module loads with the pinned woob core. Version and archive sha256 are in `vendor/woob-modules/boursorama.lock`.

            This code receives the BoursoBank login and password: read the diff before merging.

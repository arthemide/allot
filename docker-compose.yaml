services:
  db:
    container_name: db
    image: "postgres:17.1"
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
      - PGTZ=UTC
    ports:
      - "8400:5432"
    volumes:
      - stock_alerting_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    container_name: api
    image: "api"
    build:
      context: ./api
      dockerfile: Dockerfile
    env_file: "./api/.env"
    environment:
      POSTGRESQL_CONNECTION_STRING: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${DB_NAME}
      TZ: Europe/Paris
    ports:
      - "8000:8000"
    volumes:
      - ./api-logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  front:
    container_name: front
    image: "front"
    build:
      context: ./front
      dockerfile: "Dockerfile"
    ports:
      - "5173:3000" # External 5173 maps to internal container port 3000
    depends_on:
      - api

volumes:
  stock_front_node_modules:
    name: stock_front_node_modules
  stock_alerting_db:
    name: stock_alerting_db